<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Yehonatan Galo — trading systems, knowledge engines, agent orchestration">
  <defs>
    <radialGradient id="glowL" cx="0.82" cy="0.18" r="0.75">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.07"/>
      <stop offset="45%" stop-color="#7c3aed" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotsL" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1c1917" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="cardL"><rect width="1200" height="460" rx="18"/></clipPath>
    <style>
      .nameL { font: 700 58px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1c1917; letter-spacing: -1.5px; }
      .overL { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #78716c; letter-spacing: 3.5px; }
      .roleL { font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #57534e; letter-spacing: -0.2px; }
      .metaL { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #78716c; letter-spacing: 2px; }
      .tlabL { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #78716c; letter-spacing: 2px; }
      .tcmdL { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #78716c; }
      .tkeyL { font: 400 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #57534e; font-variant-numeric: tabular-nums; }
      .tvalL { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1c1917; font-variant-numeric: tabular-nums; }
      .tverdictL { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #7c3aed; font-variant-numeric: tabular-nums; }
      .tokL  { fill: #7c3aed; }
    </style>
  </defs>

  <g clip-path="url(#cardL)">
    <rect width="1200" height="460" fill="#f4f1ea"/>
    <rect width="1200" height="460" fill="url(#dotsL)"/>
    <rect width="1200" height="460" fill="url(#glowL)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="459" rx="17.5" stroke="#1c1917" stroke-opacity="0.10"/>

  <!-- left: identity -->
  <g transform="translate(72, 0)">
    <circle cx="4" cy="141" r="3.5" fill="#7c3aed">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="146" class="overL">RESEARCH INFRASTRUCTURE · 24/7 · $0 INFERENCE</text>

    <text x="0" y="216" class="nameL">Systems that earn</text>
    <text x="0" y="278" class="nameL">their conclusions.</text>

    <!-- two crossfading roles; line 1 statically visible as no-SMIL fallback -->
    <g transform="translate(0, 330)">
      <rect x="0" y="-15" width="3" height="20" rx="1.5" fill="#7c3aed"/>
      <text x="16" y="1" class="roleL" opacity="1">
        Trading research infrastructure — measured, never assumed
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.42;0.5;0.92;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="16" y="1" class="roleL" opacity="0">
        Knowledge engines built from raw video, filings and ticks
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.5;0.92;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <text x="0" y="404" class="metaL">TRADING SYSTEMS&#160;&#160;·&#160;&#160;KNOWLEDGE GRAPHS&#160;&#160;·&#160;&#160;AGENT ORCHESTRATION</text>
  </g>

  <!-- right: backtest terminal — statically visible, staged reveal when SMIL runs -->
  <g transform="translate(768, 96)">
    <rect x="0" y="0" width="360" height="268" rx="14" fill="#fffdf8"/>
    <rect x="0.5" y="0.5" width="359" height="267" rx="13.5" stroke="#1c1917" stroke-opacity="0.12"/>

    <circle cx="24" cy="26" r="4.5" fill="#a8a29e" fill-opacity="0.8"/>
    <circle cx="42" cy="26" r="4.5" fill="#a8a29e" fill-opacity="0.8"/>
    <circle cx="60" cy="26" r="4.5" fill="#a8a29e" fill-opacity="0.8"/>
    <text x="336" y="30" text-anchor="end" class="tlabL">BACKTEST LAB</text>

    <g transform="translate(28, 68)">
      <text x="0" y="0" class="tcmdL" opacity="1"><tspan class="tokL">$</tspan> backtest wyckoff --net
      </text>
      <g opacity="1">
        <text x="18" y="36" class="tkeyL">gross</text>
        <text x="304" y="36" text-anchor="end" class="tvalL">+0.013R</text>
      </g>
      <g opacity="1">
        <text x="18" y="68" class="tkeyL">net, real costs</text>
        <text x="304" y="68" text-anchor="end" class="tvalL">&#8722;0.202R</text>
      </g>
      <g opacity="1">
        <circle cx="5" cy="95" r="3" fill="#7c3aed"/>
        <text x="18" y="100" class="tkeyL">verdict</text>
        <text x="304" y="100" text-anchor="end" class="tverdictL">NO_EDGE</text>
      </g>
      <g opacity="1">
        <text x="18" y="132" class="tkeyL">strategy shipped</text>
        <text x="304" y="132" text-anchor="end" class="tvalL">no</text>
      </g>
      <g opacity="1">
        <text x="0" y="168" class="tcmdL"><tspan class="tokL">$</tspan> </text>
        <rect x="22" y="156" width="8.5" height="16" fill="#7c3aed">
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="2.5s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</svg>
